name: ReelForge
options:
  bundleIdPrefix: app.reelforge
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: YES
    DEVELOPMENT_TEAM: ""
targets:
  ReelForge:
    type: application
    platform: macOS
    sources:
      - path: Sources/ReelForgeApp
      - path: Sources/ReelForgeCore
        excludes:
          - "Resources/**"
      - path: Sources/ReelForgeCore/Resources/presets
        type: folder
        buildPhase: resources
      - path: Sources/ReelForgeCore/Resources/caption-styles
        type: folder
        buildPhase: resources
      - path: Sources/ReelForgeCore/Resources/fonts
        type: folder
        buildPhase: resources
      - path: Sources/ReelForgeCore/Resources/workflows
        type: folder
        buildPhase: resources
      - path: Sources/ReelForgeCore/Resources/models
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.reelforge.ReelForge
        PRODUCT_NAME: ReelForge
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Sources/ReelForgeApp/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 ReelForge"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/ReelForgeApp/ReelForge.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "APP_TARGET"
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
    entitlements:
      path: Sources/ReelForgeApp/ReelForge.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.assets.movies.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    info:
      path: Sources/ReelForgeApp/Info.plist
      properties:
        CFBundleDisplayName: ReelForge
        CFBundleName: ReelForge
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.video
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSLocalNetworkUsageDescription: ReelForge talks to local Ollama and Kokoro-FastAPI, downloads optional GPU packs you choose, and can use in-app model inference on this Mac.
